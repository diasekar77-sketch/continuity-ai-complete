<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; color:#1e1b4b; background:transparent; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .btn { border:none; border-radius:12px; padding:10px 16px; font-weight:700; font-size:14px; cursor:pointer; }
  .go { color:#fff; background:linear-gradient(90deg,#6366f1,#a855f7,#ec4899); box-shadow:0 6px 16px rgba(168,85,247,.35); }
  .stop { background:#fee2e2; color:#b91c1c; }
  .ghost { background:#fff; color:#4c1d95; border:1px solid #ddd6fe; }
  .btn:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
  .status { font-size:13px; color:#6b7280; margin-left:6px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#9ca3af; margin-right:6px; }
  .dot.live { background:#ef4444; animation:pulse 1s infinite; }
  @keyframes pulse { 0%{opacity:1} 50%{opacity:.3} 100%{opacity:1} }
  .who { display:flex; gap:8px; margin-bottom:6px; }
  .who button { flex:1; padding:12px; border-radius:12px; border:2px solid #e5e7eb; background:#fff; font-weight:700; font-size:14px; cursor:pointer; color:#374151; }
  .who button.cust.active { border-color:#3b82f6; background:#eff6ff; color:#1d4ed8; }
  .who button.agent.active { border-color:#7c3aed; background:#f5f3ff; color:#6d28d9; }
  .hint { font-size:12px; color:#6b7280; margin-bottom:8px; }
  #log { height:230px; overflow-y:auto; background:#fff; border:1px solid #ede9fe; border-radius:14px; padding:10px 12px; }
  .line { margin-bottom:8px; font-size:14px; line-height:1.45; }
  .tag { display:inline-block; color:#fff; font-size:11px; font-weight:700; border-radius:6px; padding:1px 8px; margin-right:6px; }
  .tag.customer { background:#3b82f6; } .tag.agent { background:#7c3aed; }
  .interim { color:#9ca3af; font-style:italic; }
  .empty { color:#9ca3af; font-size:13px; }
  #unsupported { display:none; background:#fef3c7; color:#92400e; border-radius:12px; padding:12px; font-size:13px; margin-bottom:8px; }
</style></head>
<body>
<div id="unsupported">Live speech recognition is not available in this browser. Use Google Chrome or Microsoft Edge, or type/paste the transcript below.</div>
<div class="bar">
  <button id="start" class="btn go">🎙️ Start recording</button>
  <button id="stop" class="btn stop" disabled>⏹ Stop</button>
  <button id="clear" class="btn ghost">🗑 Clear</button>
  <span class="status"><span id="dot" class="dot"></span><span id="status">Idle</span></span>
</div>
<div class="who">
  <button id="cust" class="cust active">🙂 Customer speaking</button>
  <button id="agent" class="agent">🎧 Agent speaking</button>
</div>
<div class="hint">Tap the speaker buttons, or press <b>Space</b>, whenever the other person starts talking.</div>
<div id="log"></div>

<script>
  function send(type, data) { window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: type}, data), "*"); }
  function setValue(v) { send("streamlit:setComponentValue", {value: v, dataType: "json"}); }
  function setHeight(h) { send("streamlit:setFrameHeight", {height: h}); }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let args = {lang: "en-IN"}, lines = [], seq = 0, speaker = "customer", pending = null, interim = "";
  let rec = null, running = false;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

  function status(t) { $("status").textContent = t; }
  function emit() { seq++; setValue({lines: lines, seq: seq}); }
  function syncWho() {
    const s = pending || speaker;
    $("cust").classList.toggle("active", s === "customer");
    $("agent").classList.toggle("active", s === "agent");
  }
  function buttons() {
    $("start").disabled = running; $("stop").disabled = !running;
    $("dot").classList.toggle("live", running);
    status(running ? "Recording..." : (lines.length ? "Stopped" : "Idle"));
  }
  function render() {
    let html = lines.map(l => `<div class="line"><span class="tag ${l.speaker}">${l.speaker === "customer" ? "Customer" : "Agent"}</span>${esc(l.text)}</div>`).join("");
    if (interim) html += `<div class="line interim"><span class="tag ${speaker}">${speaker === "customer" ? "Customer" : "Agent"}</span>${esc(interim)}</div>`;
    if (!html) html = '<div class="empty">The conversation will appear here as you speak.</div>';
    $("log").innerHTML = html; $("log").scrollTop = $("log").scrollHeight;
  }
  function addFinal(text) {
    text = text.trim(); if (!text) return;
    const last = lines[lines.length - 1];
    if (last && last.speaker === speaker) last.text += " " + text; else lines.push({speaker: speaker, text: text});
    emit(); render();
  }
  function makeRec() {
    const r = new SR();
    r.lang = args.lang || "en-IN"; r.continuous = true; r.interimResults = true;
    r.onresult = (e) => {
      interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) addFinal(res[0].transcript); else interim += res[0].transcript;
      }
      render();
    };
    r.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        running = false; buttons(); status("Microphone blocked. Allow microphone access for this site, then try again.");
      } else if (e.error !== "no-speech" && e.error !== "aborted") { status("Recognition error: " + e.error); }
    };
    r.onend = () => {
      interim = "";
      if (pending) { speaker = pending; pending = null; syncWho(); }
      if (running) { try { r.start(); } catch (_) {} } else { buttons(); }
      render();
    };
    return r;
  }
  function start() {
    if (!SR) { $("unsupported").style.display = "block"; return; }
    rec = makeRec(); running = true; buttons();
    try { rec.start(); } catch (e) { running = false; buttons(); }
  }
  function stop() { running = false; if (rec) rec.stop(); buttons(); }
  function setSpeaker(s) {
    if (s === (pending || speaker)) return;
    if (running && rec) { pending = s; syncWho(); rec.stop(); }   // finalize what was said, then switch
    else { speaker = s; syncWho(); }
  }

  $("start").onclick = start; $("stop").onclick = stop;
  $("clear").onclick = () => { lines = []; interim = ""; emit(); render(); buttons(); };
  $("cust").onclick = () => setSpeaker("customer"); $("agent").onclick = () => setSpeaker("agent");
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && running) { e.preventDefault(); setSpeaker((pending || speaker) === "customer" ? "agent" : "customer"); }
  });
  if (!SR) $("unsupported").style.display = "block";

  window.addEventListener("message", (e) => {
    if (e.data && e.data.type === "streamlit:render") { args = e.data.args || args; }
  });
  send("streamlit:componentReady", {apiVersion: 1});
  setHeight(385); render(); buttons();
</script></body></html>
